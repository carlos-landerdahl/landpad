[package]
name = "landpad"
version = "0.1.0"
edition = "2021"
description = "Gerenciador de área de transferência leve para Windows, com captura de tela"
license = "MIT"
repository = "https://github.com/carlos-landerdahl/landpad"
publish = false

[dependencies]
raw-window-handle = "0.6"
# Só o renderizador por software: no spike ele ficou em ~8 MB privados contra ~130 MB do OpenGL.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "software-renderer-path",
    "accessibility",
    "compat-1-2",
    "raw-window-handle-06",
] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
slint-build = "1"

[profile.release]
# "z" tirou 2 MB do executável sem mudar o tempo de abertura medido no spike.
opt-level = "z"
codegen-units = 1
lto = true
panic = "abort"
strip = true
